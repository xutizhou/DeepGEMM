version: "1"

background_agents:
  session_memory:
    enabled: true
    model: nvinf/aws/anthropic/bedrock-claude-opus-4-7
    trigger:
      min_new_tokens: 1000
      min_interval_seconds: 0
      max_interval_seconds: 120
      min_messages: 1
  task_planner:
    enabled: true
    model: nvinf/aws/anthropic/bedrock-claude-opus-4-7
    max_iterations: 1000
    wait_timeout: 300
