version: "1"

background_agents:
  session_memory:
    enabled: true
    model: nvinf/azure/openai/gpt-5.5
    trigger:
      min_new_tokens: 1000
      min_interval_seconds: 0
      max_interval_seconds: 120
      min_messages: 1
  task_planner:
    enabled: true
    model: nvinf/azure/openai/gpt-5.5
    max_iterations: 50
    wait_timeout: 300
